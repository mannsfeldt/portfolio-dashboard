name: Update prices and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 15 min during market hours (13:00-21:59 UTC covers 9:30-16:00 ET in both EST and EDT), Mon-Fri.
    # Odd minutes on purpose: GitHub drops many scheduled runs set for :00/:30, when its queues are busiest.
    # Scheduled runs are still best-effort on GitHub's side; the page shows a warning when prices fall behind.
    - cron: '7,22,37,52 13-21 * * 1-5'
    # after the close, to capture final prices
    - cron: '17 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download prices from Yahoo Finance
        shell: pwsh
        run: ./scripts/fetch-prices.ps1

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html style.css core.js app.js favicon.svg manifest.webmanifest _site/
          cp -r icons _site/icons
          cp data/prices.json _site/data/
          # version-stamp the assets so browsers never reuse a stale copy after an update
          sed -i -E "s/(core\.js|app\.js|style\.css)\"/\1?v=${GITHUB_SHA:0:8}\"/g" _site/index.html
          grep -E "core.js|app.js|style.css" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
